# ==============================================================================
# PANEL DE CONTROL INTEGRAL: RECEPTOR YAMAHA RX-V673 & CALIBRACIÓN ACÚSTICA
# ==============================================================================
type: vertical-stack
title: 🎛️ Yamaha RX-V673 · Control Acústico Total
cards:
  # 1. Reproductor y Estado Multimedia Principal
  - type: media-control
    entity: media_player.yamaha_receiver

  # 2. Telemetría y Estado de Procesamiento en Tiempo Real
  - type: glance
    title: 📊 Estado Acústico en Vivo
    show_name: true
    show_icon: true
    show_state: true
    entities:
      - entity: sensor.yamaha_perfil_peq_activo
        name: Perfil PEQ
        icon: mdi:equalizer
      - entity: sensor.yamaha_programa_dsp
        name: Modo DSP
        icon: mdi:surround-sound
      - entity: sensor.yamaha_modo_straight
        name: Straight
        icon: mdi:swap-horizontal
      - entity: sensor.yamaha_dialogue_lift
        name: Diag Lift
        icon: mdi:arrow-up-bold-box-outline
      - entity: sensor.yamaha_dialogue_level
        name: Diag Lvl
        icon: mdi:account-voice
      - entity: sensor.yamaha_entrada_activa
        name: Entrada
        icon: mdi:import

  # 3. Selector de Curva Psicoacústica y Calibración Rápida
  - type: entities
    title: 🎯 Calibración Acústica de Sala
    entities:
      - entity: input_select.yamaha_active_profile
        name: Curva Psicoacústica Activa

  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Harman Impact (Top)
        icon: mdi:bullhorn-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.calibrar_harman_impact_definitivo

      - type: button
        name: Cine Espectacular
        icon: mdi:movie-open-play
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.calibrar_cine_espectacular

      - type: button
        name: Noche & Voces
        icon: mdi:account-voice
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.calibrar_noche_voces

      - type: button
        name: Calidez Analógica
        icon: mdi:music-circle-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.calibrar_calidez_analogica_jazz

  # 4. Escenas Rápidas del Receptor
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: SCENE 1
        icon: mdi:music
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.escena_1_musica_hi_fi

      - type: button
        name: SCENE 2
        icon: mdi:filmstrip
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.escena_2_cine_estandar

      - type: button
        name: SCENE 3
        icon: mdi:weather-night
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.escena_3_noche_y_voces

      - type: button
        name: SCENE 4
        icon: mdi:stadium
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.escena_4_conciertos_live_deportes

  # 5. Ajustes Finos de Audio y Diálogos
  - type: entities
    title: 🗣️ Procesado y Elevación de Diálogos
    entities:
      - entity: input_number.yamaha_dialogue_lift_slider
        name: Dialogue Lift (Elevación a Pantalla)
      - entity: input_number.yamaha_dialogue_lvl_slider
        name: Dialogue Level (Claridad)
      - entity: input_select.yamaha_dsp_mode_select
        name: Programa DSP
      - entity: input_select.yamaha_input_select
        name: Entrada Activa
