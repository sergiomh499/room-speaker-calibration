# ==============================================================================
# PAQUETE INTEGRAL HOME ASSISTANT: YAMAHA RX-V673 + CALIBRACIÓN DE SALA
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. INTEGRACIÓN NATIVA MEDIA PLAYER DE YAMAHA
# ------------------------------------------------------------------------------
media_player:
  - platform: yamaha
    host: 192.168.1.43
    name: "Yamaha RX-V673"
    zone_names:
      Main_Zone: "Salón Principal"

# ------------------------------------------------------------------------------
# 2. SENSOR REST DE TELEMETRÍA EN TIEMPO REAL (YAMAHA + CALIBRACIÓN)
# ------------------------------------------------------------------------------
rest:
  - resource: "http://localhost:8899/api/status"
    scan_interval: 5
    sensor:
      - name: "Yamaha Entrada Activa"
        unique_id: "yamaha_sensor_input"
        value_template: "{{ value_json.input }}"
        icon: "mdi:import"

      - name: "Yamaha Volumen dB"
        unique_id: "yamaha_sensor_volume_db"
        value_template: "{{ value_json.volume_db }}"
        unit_of_measurement: "dB"
        icon: "mdi:volume-high"

      - name: "Yamaha Programa DSP"
        unique_id: "yamaha_sensor_sound_program"
        value_template: "{{ value_json.sound_program }}"
        icon: "mdi:surround-sound"

      - name: "Yamaha Modo Straight"
        unique_id: "yamaha_sensor_straight"
        value_template: "{{ 'Activo' if value_json.straight else 'Inactivo' }}"
        icon: "mdi:swap-horizontal"

      - name: "Yamaha Dialogue Lift"
        unique_id: "yamaha_sensor_dialogue_lift"
        value_template: "{{ value_json.dialogue_lift }}"
        icon: "mdi:arrow-up-bold-box-outline"

      - name: "Yamaha Dialogue Level"
        unique_id: "yamaha_sensor_dialogue_lvl"
        value_template: "{{ value_json.dialogue_lvl }}"
        icon: "mdi:account-voice"

      - name: "Yamaha Adaptive DRC"
        unique_id: "yamaha_sensor_adaptive_drc"
        value_template: "{{ value_json.adaptive_drc }}"
        icon: "mdi:compress"

      - name: "Yamaha Perfil PEQ Activo"
        unique_id: "yamaha_sensor_active_peq"
        value_template: "{{ value_json.active_peq }}"
        icon: "mdi:equalizer"

# ------------------------------------------------------------------------------
# 3. COMANDOS REST (CONTROL Y CALIBRACIÓN)
# ------------------------------------------------------------------------------
rest_command:
  # Calibraciones de Sala
  yamaha_calibrate_harman_impact:
    url: "http://localhost:8899/api/calibrate?target=harman_impact"
    method: GET

  yamaha_calibrate_harman_neutral:
    url: "http://localhost:8899/api/calibrate?target=harman_neutral"
    method: GET

  yamaha_calibrate_cinema_impact:
    url: "http://localhost:8899/api/calibrate?target=cinema_impact"
    method: GET

  yamaha_calibrate_vocal_clarity:
    url: "http://localhost:8899/api/calibrate?target=vocal_clarity"
    method: GET

  yamaha_calibrate_warm_music:
    url: "http://localhost:8899/api/calibrate?target=warm_music"
    method: GET

  yamaha_calibrate_audiophile_flat:
    url: "http://localhost:8899/api/calibrate?target=audiophile_flat"
    method: GET

  # Escenas Rápidas
  yamaha_set_scene_1_music:
    url: "http://localhost:8899/api/scene?num=1"
    method: GET

  yamaha_set_scene_2_cinema:
    url: "http://localhost:8899/api/scene?num=2"
    method: GET

  yamaha_set_scene_3_night:
    url: "http://localhost:8899/api/scene?num=3"
    method: GET

  yamaha_set_scene_4_concerts:
    url: "http://localhost:8899/api/scene?num=4"
    method: GET

  # Control de Parámetros de Audio
  yamaha_set_straight:
    url: "http://localhost:8899/api/control?param=straight&val={{ val }}"
    method: GET

  yamaha_set_dialogue_lift:
    url: "http://localhost:8899/api/control?param=dialogue_lift&val={{ val }}"
    method: GET

  yamaha_set_dialogue_lvl:
    url: "http://localhost:8899/api/control?param=dialogue_lvl&val={{ val }}"
    method: GET

  yamaha_set_adaptive_drc:
    url: "http://localhost:8899/api/control?param=adaptive_drc&val={{ val }}"
    method: GET

  yamaha_set_sound_program:
    url: "http://localhost:8899/api/control?param=sound_program&val={{ val }}"
    method: GET

  yamaha_set_input:
    url: "http://localhost:8899/api/control?param=input&val={{ val }}"
    method: GET

# ------------------------------------------------------------------------------
# 4. SELECTORES E INTERRUPTORES (UI)
# ------------------------------------------------------------------------------
input_select:
  yamaha_active_profile:
    name: "Perfil Acústico (Curva)"
    options:
      - "Harman Impact (Definitivo)"
      - "Harman Neutral"
      - "Cinema Impact"
      - "Vocal Clarity"
      - "Warm Music"
      - "Audiophile Flat"
    initial: "Harman Impact (Definitivo)"
    icon: "mdi:equalizer"

  yamaha_dsp_mode_select:
    name: "Programa Cinema DSP"
    options:
      - "Straight"
      - "Standard"
      - "Drama"
      - "Music Video"
      - "Spectacle"
      - "Sci-Fi"
      - "Adventure"
      - "7ch Stereo"
      - "Hall in Munich"
    initial: "Standard"
    icon: "mdi:surround-sound"

  yamaha_input_select:
    name: "Entrada de Audio / Vídeo"
    options:
      - "AV4"
      - "V-AUX"
      - "HDMI1"
      - "HDMI2"
      - "AUDIO1"
      - "TUNER"
      - "NET"
    initial: "AV4"
    icon: "mdi:import"

# ------------------------------------------------------------------------------
# 5. NÚMEROS / CONTROLES DESLIZANTES
# ------------------------------------------------------------------------------
input_number:
  yamaha_dialogue_lift_slider:
    name: "Elevación de Diálogos (Lift)"
    min: 0
    max: 5
    step: 1
    initial: 1
    icon: "mdi:arrow-up-bold-box-outline"

  yamaha_dialogue_lvl_slider:
    name: "Nivel de Diálogos (Level)"
    min: 0
    max: 3
    step: 1
    initial: 1
    icon: "mdi:account-voice"

# ------------------------------------------------------------------------------
# 6. BOTONES DIRECTOS
# ------------------------------------------------------------------------------
template:
  - button:
      - name: "Calibrar Harman Impact (Definitivo)"
        unique_id: "yamaha_btn_calib_harman_impact"
        icon: "mdi:bullhorn-outline"
        press:
          - action: rest_command.yamaha_calibrate_harman_impact
          - action: input_select.select_option
            target:
              entity_id: input_select.yamaha_active_profile
            data:
              option: "Harman Impact (Definitivo)"

      - name: "Calibrar Cine Espectacular"
        unique_id: "yamaha_btn_calib_cinema_impact"
        icon: "mdi:movie-open-play"
        press:
          - action: rest_command.yamaha_calibrate_cinema_impact
          - action: input_select.select_option
            target:
              entity_id: input_select.yamaha_active_profile
            data:
              option: "Cinema Impact"

      - name: "Calibrar Noche & Voces"
        unique_id: "yamaha_btn_calib_vocal_clarity"
        icon: "mdi:account-voice"
        press:
          - action: rest_command.yamaha_calibrate_vocal_clarity
          - action: input_select.select_option
            target:
              entity_id: input_select.yamaha_active_profile
            data:
              option: "Vocal Clarity"

      - name: "Calibrar Calidez Analógica / Jazz"
        unique_id: "yamaha_btn_calib_warm_music"
        icon: "mdi:music-circle-outline"
        press:
          - action: rest_command.yamaha_calibrate_warm_music
          - action: input_select.select_option
            target:
              entity_id: input_select.yamaha_active_profile
            data:
              option: "Warm Music"

      # Escenas
      - name: "Escena 1: Música Hi-Fi"
        unique_id: "yamaha_btn_scene_1"
        icon: "mdi:music"
        press:
          - action: rest_command.yamaha_set_scene_1_music

      - name: "Escena 2: Cine Estándar"
        unique_id: "yamaha_btn_scene_2"
        icon: "mdi:filmstrip"
        press:
          - action: rest_command.yamaha_set_scene_2_cinema

      - name: "Escena 3: Noche y Voces"
        unique_id: "yamaha_btn_scene_3"
        icon: "mdi:weather-night"
        press:
          - action: rest_command.yamaha_set_scene_3_night

      - name: "Escena 4: Conciertos Live & Deportes"
        unique_id: "yamaha_btn_scene_4"
        icon: "mdi:stadium"
        press:
          - action: rest_command.yamaha_set_scene_4_concerts

# ------------------------------------------------------------------------------
# 7. AUTOMATISMOS DE CONTROL BIDIRECCIONAL
# ------------------------------------------------------------------------------
automation:
  - alias: "Yamaha - Aplicar Calibración al Cambiar Selector"
    id: "yamaha_auto_apply_calibration"
    trigger:
      - platform: state
        entity_id: input_select.yamaha_active_profile
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Harman Impact (Definitivo)"
            sequence:
              - action: rest_command.yamaha_calibrate_harman_impact
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Harman Neutral"
            sequence:
              - action: rest_command.yamaha_calibrate_harman_neutral
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Cinema Impact"
            sequence:
              - action: rest_command.yamaha_calibrate_cinema_impact
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Vocal Clarity"
            sequence:
              - action: rest_command.yamaha_calibrate_vocal_clarity
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Warm Music"
            sequence:
              - action: rest_command.yamaha_calibrate_warm_music
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_active_profile
                state: "Audiophile Flat"
            sequence:
              - action: rest_command.yamaha_calibrate_audiophile_flat

  - alias: "Yamaha - Sincronizar Dialogue Lift Slider"
    id: "yamaha_sync_dialogue_lift"
    trigger:
      - platform: state
        entity_id: input_number.yamaha_dialogue_lift_slider
    action:
      - action: rest_command.yamaha_set_dialogue_lift
        data:
          val: "{{ states('input_number.yamaha_dialogue_lift_slider') | int }}"

  - alias: "Yamaha - Sincronizar Dialogue Level Slider"
    id: "yamaha_sync_dialogue_lvl"
    trigger:
      - platform: state
        entity_id: input_number.yamaha_dialogue_lvl_slider
    action:
      - action: rest_command.yamaha_set_dialogue_lvl
        data:
          val: "{{ states('input_number.yamaha_dialogue_lvl_slider') | int }}"

  - alias: "Yamaha - Sincronizar Modo DSP Select"
    id: "yamaha_sync_dsp_select"
    trigger:
      - platform: state
        entity_id: input_select.yamaha_dsp_mode_select
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.yamaha_dsp_mode_select
                state: "Straight"
            sequence:
              - action: rest_command.yamaha_set_straight
                data:
                  val: "On"
        default:
          - action: rest_command.yamaha_set_straight
            data:
              val: "Off"
          - action: rest_command.yamaha_set_sound_program
            data:
              val: "{{ states('input_select.yamaha_dsp_mode_select') }}"

  - alias: "Yamaha - Sincronizar Entrada Select"
    id: "yamaha_sync_input_select"
    trigger:
      - platform: state
        entity_id: input_select.yamaha_input_select
    action:
      - action: rest_command.yamaha_set_input
        data:
          val: "{{ states('input_select.yamaha_input_select') }}"
