<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Sound Wave Graphic -->
  <g transform="translate(64, 160)">
    <!-- Bass speaker cone concentric circles -->
    <circle cx="96" cy="96" r="70" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.3"/>
    <circle cx="96" cy="96" r="46" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.6"/>
    <circle cx="96" cy="96" r="22" fill="#38bdf8"/>
    
    <!-- Frequency response curve -->
    <path d="M 180 96 C 210 30, 240 160, 270 96 C 300 32, 330 96, 370 96" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- PEQ node markers -->
    <circle cx="210" cy="42" r="10" fill="#38bdf8"/>
    <circle cx="240" cy="150" r="10" fill="#f43f5e"/>
    <circle cx="300" cy="42" r="10" fill="#818cf8"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">OCTAVE</text>
  <text x="256" y="456" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ACOUSTIC CALIBRATION</text>
</svg>
